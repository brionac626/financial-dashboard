name: Validate and deploy Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Push and manual production runs share a queue. PRs never block production.
concurrency:
  group: pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --allow-remote=root
      - name: Test
        run: npm test
      - name: Verify deployment scripts offline
        run: npm run test:deploy
      - name: Typecheck and build
        run: npm run build
      - name: Deploy production
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          project_name="$(node -e 'process.stdout.write(process.env.CLOUDFLARE_PROJECT_NAME || JSON.parse(require("node:fs").readFileSync("wrangler.jsonc", "utf8")).name)')"
          if [[ ! "$project_name" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::Invalid Cloudflare Pages project name."
            exit 1
          fi
          test -f dist/index.html
          node node_modules/wrangler/bin/wrangler.js pages deploy dist --project-name "$project_name" --branch main
